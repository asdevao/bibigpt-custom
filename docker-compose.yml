services:
  bibigpt:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
    container_name: bibigpt
    network_mode: host
    environment:
      - PORT=19368
      - HOSTNAME=0.0.0.0
    env_file:
      - .env
    restart: unless-stopped
    mem_limit: 2g
